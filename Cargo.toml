[package]
name = "nadir"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A terminal application that tracks a satellite overhead in real time — world map, telemetry, passes, space weather and launches. Real SGP4, computed locally."
license = "MIT"

[dependencies]
ratatui = "0.30.2"
sgp4 = { version = "2.4.0", features = ["serde"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "rustls-native-certs", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
directories = "6"
anyhow = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
